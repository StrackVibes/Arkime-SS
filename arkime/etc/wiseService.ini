# WISE Service Config - https://arkime.com/wise
[wiseService]
port = 8081

# Global domains to never lookup
excludeDomains=*.bl.barracudabrts.com;*.zen.spamhaus.org;*.in-addr.arpa;*.avts.mcafee.com;*.avqs.mcafee.com;*.bl.barracuda.com;*.lbl8.mailshell.net;*.dnsbl.sorbs.net;*.s.sophosxl.net;*.metric.gstatic.com;*.ip6.arpa

# Where the user database is
# For user/password use https://user:pass@host:port OR usersElasticsearchBasicAuth
# usersElasticsearch=ARKIME_ELASTICSEARCH
# usersElasticsearchBasicAuth=
#
# Use digest auth by default
# If using SSO change to the http header with the username in it
userNameHeader=anonymous

############## Redis Cache ##############

# If you have many query sources, like OpenSearch/Elasticsearch or virustotal setup a redis server locally
#[cache]
#type=redis
#url=redis://localhost/0


############## Wise Sources ##############

# NRD-db integration (optional, OFF by default) -- links WISE to a
# separate NRD-db deployment (https://github.com/StrackVibes/NRD-db) for
# newly-registered-domain tagging and DNS/ASN/WHOIS/certificate
# enrichment. Arkime-SS does not require this; leave both blocks below
# commented out unless you're also running NRD-db.
#
# To enable:
#   1. Deploy NRD-db (the nrd redis service, and optionally its
#      nrd-enrich sidecar) per that repo's own README.
#   2. Uncomment both [redis:NRD-db] and [redis:NRD-enrich] sections
#      below (every line, including the [section] header).
#   3. Point each redisURL at your NRD-db redis host:port, e.g.
#      redis://<host>:6379/0 -- 10.0.0.12 below is just an example.
#   4. [redis:NRD-enrich] additionally requires the nrd:enrichwise:
#      JSON-mirror write in NRD-db's enrich/redis_client.py (added
#      specifically for this integration) -- Arkime's redis source
#      can only parse a GET reply as text, not nrd-enrich's raw
#      nrd:enrich: hash directly.
#[redis:NRD-db]
#tags=NRD
#type=domain
#redisURL=redis://10.0.0.12:6379/0
#fields=field:nrd.date;kind:termfield;count:false;friendly:NRD Date;db:nrd.date;help:Date the domain appeared on the newly-registered-domain list;shortcut:0\n
#view=if (session.nrd && session.nrd.date)\n  div.sessionDetailMeta.bold Newly Registered Domain\n  dl.sessionDetailMeta\n    +arrayList(session.nrd, 'date', 'Date', 'nrd.date')\n    +arrayList(session.nrd, 'registrar', 'Registrar', 'nrd.registrar')\n    +arrayList(session.nrd, 'created', 'Registered', 'nrd.created')\n    +arrayList(session.nrd, 'expires', 'Expires', 'nrd.expires')\n    +arrayList(session.nrd, 'dns', 'DNS Status', 'nrd.dns')\n    +arrayList(session.nrd, 'ip', 'Resolves To', 'nrd.ip')\n    +arrayList(session.nrd, 'ns', 'Nameservers', 'nrd.ns')\n    +arrayList(session.nrd, 'certs', 'Certificates', 'nrd.certs')\n    +arrayList(session.nrd, 'certIssuer', 'Cert Issuer', 'nrd.certIssuer')\n    +arrayList(session.nrd, 'vtMalicious', 'VT Malicious', 'nrd.vtMalicious')\n    +arrayList(session.nrd, 'vtSuspicious', 'VT Suspicious', 'nrd.vtSuspicious')\n    +arrayList(session.nrd, 'asn', 'ASN', 'nrd.asn')\n    +arrayList(session.nrd, 'asName', 'AS Name', 'nrd.asName')\n    +arrayList(session.nrd, 'asnCountry', 'ASN Country', 'nrd.asnCountry')\n
#
#[redis:NRD-enrich]
#tags=NRD
#type=domain
#redisURL=redis://10.0.0.12:6379/0
#template=nrd:enrichwise:%key%
#format=json
#keyPath=nrd_date
#fields=field:nrd.asn;kind:termfield;count:false;friendly:NRD ASN;db:nrd.asn;help:ASN of a resolved IP;shortcut:asn_info.asn\nfield:nrd.asName;kind:termfield;count:false;friendly:NRD AS Name;db:nrd.asName;help:AS organization of a resolved IP;shortcut:asn_info.as_name\nfield:nrd.asnCountry;kind:termfield;count:false;friendly:NRD ASN Country;db:nrd.asnCountry;help:Country of a resolved IP's ASN;shortcut:asn_info.country\nfield:nrd.certIssuer;kind:termfield;count:false;friendly:NRD Cert Issuer;db:nrd.certIssuer;help:Latest certificate issuer;shortcut:crt_latest_issuer\nfield:nrd.certs;kind:termfield;count:false;friendly:NRD Certificates;db:nrd.certs;help:Certificate Transparency cert count;shortcut:crt_cert_count\nfield:nrd.created;kind:termfield;count:false;friendly:NRD Registered;db:nrd.created;help:WHOIS registration date;shortcut:whois_created_date\nfield:nrd.dns;kind:termfield;count:false;friendly:NRD DNS Status;db:nrd.dns;help:DNS resolution status;shortcut:dns_status\nfield:nrd.expires;kind:termfield;count:false;friendly:NRD Expires;db:nrd.expires;help:WHOIS expiry date;shortcut:whois_expires_date\nfield:nrd.ip;kind:termfield;count:false;friendly:NRD Resolves To;db:nrd.ip;help:Resolved A records;shortcut:dns_a\nfield:nrd.ns;kind:termfield;count:false;friendly:NRD Nameservers;db:nrd.ns;help:Resolved NS records;shortcut:dns_ns\nfield:nrd.registrar;kind:termfield;count:false;friendly:NRD Registrar;db:nrd.registrar;help:WHOIS registrar;shortcut:whois_registrar\nfield:nrd.vtMalicious;kind:termfield;count:false;friendly:NRD VT Malicious;db:nrd.vtMalicious;help:VirusTotal malicious vote count;shortcut:vt_malicious\nfield:nrd.vtSuspicious;kind:termfield;count:false;friendly:NRD VT Suspicious;db:nrd.vtSuspicious;help:VirusTotal suspicious vote count;shortcut:vt_suspicious

