# WISE Service Config - https://arkime.com/wise
[wiseService]
port = 8081

# Global domains to never lookup
excludeDomains=*.bl.barracudabrts.com;*.zen.spamhaus.org;*.in-addr.arpa;*.avts.mcafee.com;*.avqs.mcafee.com;*.bl.barracuda.com;*.lbl8.mailshell.net;*.dnsbl.sorbs.net;*.s.sophosxl.net;*.metric.gstatic.com;*.ip6.arpa

# Where the user database is
# For user/password use https://user:pass@host:port OR usersElasticsearchBasicAuth
# usersElasticsearch=ARKIME_ELASTICSEARCH
# usersElasticsearchBasicAuth=
#
# Use digest auth by default
# If using SSO change to the http header with the username in it
userNameHeader=anonymous

############## Redis Cache ##############

# If you have many query sources, like OpenSearch/Elasticsearch or virustotal setup a redis server locally
#[cache]
#type=redis
#url=redis://localhost/0


############## Wise Sources ##############

# NRD-db integration (optional, OFF by default) -- links WISE to a
# separate NRD-db deployment (https://github.com/StrackVibes/NRD-db) for
# newly-registered-domain tagging and DNS/ASN/WHOIS/certificate
# enrichment. Arkime-SS does not require this; leave both blocks below
# commented out unless you're also running NRD-db.
#
# To enable:
#   1. Deploy NRD-db (the nrd redis service, and optionally its
#      nrd-enrich sidecar) per that repo's own README.
#   2. Uncomment both [redis:NRD-db] and [redis:NRD-enrich] sections
#      below (every line, including the [section] header).
#   3. Point each redisURL at your NRD-db redis host:port, e.g.
#      redis://<host>:6379/0 -- 10.0.0.12 below is just an example.
#   4. [redis:NRD-enrich] additionally requires the nrd:enrichwise:
#      JSON-mirror write in NRD-db's enrich/redis_client.py (added
#      specifically for this integration) -- Arkime's redis source
#      can only parse a GET reply as text, not nrd-enrich's raw
#      nrd:enrich: hash directly.
#[redis:NRD-db]
#tags=NRD-date
#type=domain
#redisURL=redis://10.0.0.12:6379/0
#fields=field:nrd.date;kind:termfield;count:false;friendly:NRD Date;db:nrd.date;help:Newly Degistered Domain date;shortcut:0\n
#view=require:nrd.date;title:Newly Registered Domain;fields:nrd.date

#[redis:NRD-enrich]
#tags=NRD-enriched
#type=domain
#redisURL=redis://10.0.0.12:6379/0
#template=nrd:enrichwise:%key%
#format=json
#keyPath=nrd_date
#fields=field:nrdenrich.dns_status;kind:termfield;count:false;friendly:NRD Enrich DNS Status;db:dns_status;help:DNS resolution status;shortcut:dns_status\nfield:nrdenrich.dns_a;kind:termfield;count:false;friendly:NRD Enrich DNS A;db:dns_a;help:Resolved A records;shortcut:dns_a\nfield:nrdenrich.dns_ns;kind:termfield;count:false;friendly:NRD Enrich DNS NS;db:dns_ns;help:Resolved NS records;shortcut:dns_ns\nfield:nrdenrich.whois_registrar;kind:termfield;count:false;friendly:NRD Enrich Registrar;db:whois_registrar;help:WHOIS registrar;shortcut:whois_registrar\nfield:nrdenrich.whois_created_date;kind:termfield;count:false;friendly:NRD Enrich Created Date;db:whois_created_date;help:WHOIS registration date;shortcut:whois_created_date\nfield:nrdenrich.crt_cert_count;kind:termfield;count:false;friendly:NRD Enrich Cert Count;db:crt_cert_count;help:Certificate Transparency cert count;shortcut:crt_cert_count\nfield:nrdenrich.crt_latest_issuer;kind:termfield;count:false;friendly:NRD Enrich Cert Issuer;db:crt_latest_issuer;help:Latest certificate issuer;shortcut:crt_latest_issuer\nfield:nrdenrich.vt_malicious;kind:termfield;count:false;friendly:NRD Enrich VT Malicious;db:vt_malicious;help:VirusTotal malicious vote count;shortcut:vt_malicious\nfield:nrdenrich.vt_suspicious;kind:termfield;count:false;friendly:NRD Enrich VT Suspicious;db:vt_suspicious;help:VirusTotal suspicious vote count;shortcut:vt_suspicious\nfield:nrdenrich.asn_info;kind:termfield;count:false;friendly:NRD Enrich ASN Info;db:asn_info;help:IP2ASN info for resolved IPs;shortcut:asn_info\n
#view=if (session.nrdenrich)\n  div.sessionDetailMeta.bold NRD Enrichment\n  dl.sessionDetailMeta\n    +arrayList(session.nrdenrich, 'dns_status', 'DNS Status', 'nrdenrich.dns_status')\n    +arrayList(session.nrdenrich, 'dns_a', 'DNS A', 'nrdenrich.dns_a')\n    +arrayList(session.nrdenrich, 'whois_registrar', 'Registrar', 'nrdenrich.whois_registrar')\n    +arrayList(session.nrdenrich, 'whois_created_date', 'Registered', 'nrdenrich.whois_created_date')\n    +arrayList(session.nrdenrich, 'crt_cert_count', 'Cert Count', 'nrdenrich.crt_cert_count')\n    +arrayList(session.nrdenrich, 'crt_latest_issuer', 'Cert Issuer', 'nrdenrich.crt_latest_issuer')\n    +arrayList(session.nrdenrich, 'vt_malicious', 'VT Malicious', 'nrdenrich.vt_malicious')\n    +arrayList(session.nrdenrich, 'vt_suspicious', 'VT Suspicious', 'nrdenrich.vt_suspicious')\n    +arrayList(session.nrdenrich, 'asn_info', 'ASN Info', 'nrdenrich.asn_info')\n

